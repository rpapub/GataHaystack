<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UiPath Orchestrator API - Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet"
        href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .topbar {
      background-color: #fa4616;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: 'openapi-merged.yml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIBundle.SwaggerUIStandalonePreset
      ],
      layout: 'StandaloneLayout',
      // Enable OAuth2 authentication
      oauth2RedirectUrl: window.location.origin + window.location.pathname.replace('swagger.html', '') + 'oauth2-redirect.html',
      persistAuthorization: true,
      // Display operation IDs
      displayOperationId: true,
      displayRequestDuration: true,
      filter: true,
      tryItOutEnabled: true
    });

    // Initialize OAuth2 configuration
    // NOTE: Replace the clientId with your actual UiPath OAuth2 client ID
    window.ui.initOAuth({
      clientId: 'YOUR_CLIENT_ID_HERE', // Replace with your OAuth2 client ID
      clientSecret: '', // For public clients, leave empty and use PKCE
      realm: 'uipath',
      appName: 'UiPath Orchestrator API Explorer',
      scopeSeparator: ' ',
      scopes: 'OR.Administration OR.Assets OR.Execution OR.Folders OR.Jobs OR.Monitoring OR.Robots OR.Settings OR.Tasks OR.Users',
      additionalQueryStringParams: {},
      useBasicAuthenticationWithAccessCodeGrant: false,
      usePkceWithAuthorizationCodeGrant: true // Enable PKCE for better security
    });
  </script>
</body>
</html>
