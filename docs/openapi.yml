    "/oauth2_uipath/request_access_token_with_clientid": {
      "get": {
        "tags": [
          "oauth2",
          "uipathcloud"
        ],
        "summary": "Oauth2 Request Access Token With Clientid",
        "description": "Redirect to Authorization Server\n\nInitiates the OAuth 2.0 authorization flow by redirecting the client's user agent to the authorization server.\nThis step is typically used to obtain user authorization before exchanging the authorization code for an access token.\nThe redirection to the authorization server is constructed using the provided `clientid` and configurations obtained from `settings`.\n\nParameters:\n- clientid (str): Client identifier as registered with the authorization server.\n- settings (Settings): Application settings object, obtained via dependency injection, containing necessary configuration such as the authorization server URL.\n\nReturns:\n- A redirect response leading the user agent to the authorization server's consent page.",
        "operationId": "oauth2_request_access_token_with_clientid_oauth2_uipath_request_access_token_with_clientid_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/oauth2_uipath/receive_authcode": {
      "get": {
        "tags": [
          "oauth2",
          "uipathcloud"
        ],
        "summary": "Oauth2 Receive Authcode",
        "description": "OAuth 2.0 Authorization Code Receiver\n\nThis endpoint serves as the redirection URI that receives the authorization code from the authorization server.\nIt is part of the OAuth 2.0 authorization code flow. The client application must register this redirect URI with\nthe authorization server ahead of time. The authorization server may validate the URI for security purposes before\nsending the authorization code to it.\n\nUpon receiving the authorization code, the client application can proceed to exchange it for an access token at the\ntoken endpoint of the authorization server.\n\nParameters:\n- code (str): The authorization code sent by the authorization server as a response to the client's authorization request.\n\nReturns:\n- A confirmation that the code has been received, which may include further instructions on how to exchange the code for an access token.",
        "operationId": "oauth2_receive_authcode_oauth2_uipath_receive_authcode_get",
        "parameters": [
          {
            "name": "code",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Code"
            }
          },
          {
            "name": "state",
            "in": "query",
            "required": true,
