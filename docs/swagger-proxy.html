<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UiPath Orchestrator API - Proxy Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .topbar {
      background-color: #fa4616;
    }
    .info {
      background: #e8f5e9;
      padding: 20px;
      margin: 20px;
      border-radius: 4px;
      border-left: 4px solid #4caf50;
    }
    .info h2 {
      margin-top: 0;
      color: #2e7d32;
    }
    .info p {
      margin: 8px 0;
    }
    .info code {
      background: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="info">
    <h2>✓ FastAPI Proxy Mode - No CORS Issues!</h2>
    <p><strong>Status:</strong> All requests are proxied through FastAPI server</p>
    <p><strong>Authentication:</strong> Handled automatically server-side</p>
    <p><strong>Account:</strong> <code>cprimadotnet</code></p>
    <p><strong>Tenant:</strong> <code>cprima</code></p>
    <p><strong>Note:</strong> No need to click "Authorize" - authentication is automatic!</p>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/static/openapi-proxy.yml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],
      layout: 'StandaloneLayout',
      displayOperationId: true,
      displayRequestDuration: true,
      filter: true,
      tryItOutEnabled: true,
      // No OAuth configuration needed - authentication handled by proxy!
      persistAuthorization: false
    });
  </script>
</body>
</html>
