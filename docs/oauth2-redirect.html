<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OAuth2 Redirect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <div id="debug" style="display:none; font-family:monospace; padding:20px;"></div>
  <script>
    'use strict';
    (function() {
      function debug(msg) {
        console.log('[OAuth2 Redirect]', msg);
        var el = document.getElementById('debug');
        el.style.display = 'block';
        el.innerHTML += msg + '<br>';
      }

      function run() {
        debug('Starting OAuth2 redirect handler');
        debug('Full URL: ' + window.location.href);

        if (!window.opener) {
          debug('ERROR: No window.opener - was this opened in a popup?');
          document.body.innerHTML = '<p>Error: This page must be opened in a popup from Swagger UI</p>';
          return;
        }

        if (!window.opener.swaggerUIRedirectOauth2) {
          debug('ERROR: window.opener.swaggerUIRedirectOauth2 not found');
          document.body.innerHTML = '<p>Error: Cannot communicate with Swagger UI</p>';
          return;
        }

        var oauth2 = window.opener.swaggerUIRedirectOauth2;
        debug('OAuth2 object found');
        debug('Expected state: ' + (oauth2.state || 'undefined'));
        var sentState = oauth2.state;
        var redirectUrl = oauth2.redirectUrl;
        var isValid, qp, arr;

        if (/code|token|error/.test(window.location.hash)) {
          qp = window.location.hash.substring(1).replace('?', '&');
          debug('Params from hash: ' + qp);
        } else {
          qp = location.search.substring(1);
          debug('Params from query string: ' + qp);
        }

        arr = qp.split("&");
        arr.forEach(function(v, i, _arr) {
          var a = _arr[i].split("=");
          _arr[i] = {
            name: a[0],
            value: a[1]
          };
        });

        var responseType = oauth2.responseType;
        var receivedState = (arr.find(function(v) { return v.name === "state"; }) || {}).value;
        var code = (arr.find(function(v) { return v.name === "code"; }) || {}).value;
        var token = (arr.find(function(v) { return v.name === "access_token"; }) || {}).value;
        var error = (arr.find(function(v) { return v.name === "error"; }) || {}).value;

        debug('Response type: ' + responseType);
        debug('Received state: ' + (receivedState || 'undefined'));
        debug('Authorization code: ' + (code ? code.substring(0, 20) + '...' : 'undefined'));
        debug('Error: ' + (error || 'none'));

        isValid = sentState === receivedState;
        debug('State valid: ' + isValid);

        if ((responseType === "code" || responseType === "query") && !receivedState) {
          isValid = true;
        }

        if (!isValid) {
          oauth2.errCb({
            authId: oauth2.auth.name,
            source: "auth",
            level: "warning",
            message: "Authorization may be unsafe, passed state was changed in server. The passed state wasn't returned from auth server."
          });
        }

        if (error) {
          oauth2.errCb({
            authId: oauth2.auth.name,
            source: "auth",
            level: "error",
            message: JSON.stringify(arr)
          });
        } else if (responseType === "code") {
          oauth2.callback({
            auth: oauth2.auth,
            redirectUrl: redirectUrl,
            code: code
          });
        } else {
          oauth2.callback({
            auth: oauth2.auth,
            token: token,
            isValid: isValid
          });
        }

        window.close();
      }

      if (document.readyState !== 'loading') {
        run();
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          run();
        });
      }
    })();
  </script>
</body>
</html>
